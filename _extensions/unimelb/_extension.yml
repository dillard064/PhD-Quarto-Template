title: UniMelb RevealJS
author: University of Melbourne / CSIRO
version: 3.0.0
quarto-required: ">=1.3.0"
contributes:
  formats:
    revealjs:
      theme: [default, unimelb-revealjs.scss]
      slide-number: c/t
      show-slide-number: all
      center: false
      center-title-slide: true
      history: true
      progress: true
      controls: false
      transition: fade
      transition-speed: fast
      background-transition: fade
      highlight-style: github
      code-block-bg: true
      code-block-border-left: "#00A9CE"
      navigation-mode: linear
      include-in-header:
        text: |
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:ital,wght@0,300;0,400;0,700;1,300;1,400&family=Source+Code+Pro:wght@400;500&display=swap" rel="stylesheet">
      include-after-body:
        text: |
          <div class="title-strap"></div>
          <div class="slide-logos">
            <img class="logo-unimelb"
                 src="_extensions/unimelb/assets/unimelb-logo.svg"
                 alt="The University of Melbourne">
            <img class="logo-csiro"
                 src="_extensions/unimelb/assets/csiro-logo.svg"
                 alt="CSIRO">
          </div>
          <script>
          (function () {
            function isDark(hex) {
              if (!hex) return false;
              var h = hex.replace('#', '');
              if (h.length === 3) h = h.split('').map(function (c) { return c + c; }).join('');
              var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
              return (0.299*r + 0.587*g + 0.114*b) / 255 < 0.4;
            }

            function update(slide) {
              if (!slide) return;
              var dark  = isDark(slide.getAttribute('data-background-color'));
              var title = slide.id === 'title-slide';
              // The strap is pinned to the viewport bottom in CSS; JS only flags state.
              document.body.classList.toggle('title-active', title);
              document.body.classList.toggle('dark-slide', dark);
            }

            // PDF export (?print-pdf): reveal rebuilds the deck as a stack of
            // .pdf-page divs, so position:fixed overlays collapse onto page one.
            // Hide the live overlays and stamp a copy into every page instead —
            // .pdf-page is position:relative, so absolute children anchor to it.
            var printed = false;
            function setupPrint() {
              if (printed) return;
              var logos = document.querySelector('.slide-logos');
              if (!logos) return;
              var pages = document.querySelectorAll('.reveal .slides .pdf-page');
              if (!pages.length) return;
              printed = true;

              var strap = document.querySelector('.title-strap');
              // Per-slide state replaces the body-level flags in print.
              document.body.classList.remove('title-active', 'dark-slide');
              document.body.classList.add('pdf-export');

              for (var i = 0; i < pages.length; i++) {
                var page = pages[i];
                var sec  = page.querySelector('section');
                if (!sec) continue;

                var title = sec.id === 'title-slide';

                var c = logos.cloneNode(true);
                c.className = 'slide-logos pdf-logos' + (title ? ' pdf-logos-title' : '');
                page.appendChild(c);

                if (title && strap) {
                  var s = strap.cloneNode(true);
                  s.className = 'title-strap pdf-strap';
                  page.appendChild(s);
                }
              }
            }

            function init() {
              if (typeof Reveal === 'undefined') return;
              Reveal.on('ready',        function (e) { update(e.currentSlide); });
              Reveal.on('slidechanged', function (e) { update(e.currentSlide); });
              Reveal.on('pdf-ready',    setupPrint);
              try { update(Reveal.getCurrentSlide()); } catch (e) {}
              // Fallback in case pdf-ready fired before this script bound to it
              if (/print-pdf/gi.test(window.location.search)) {
                setTimeout(setupPrint, 500);
                window.addEventListener('load', function () { setTimeout(setupPrint, 0); });
              }
            }

            if (document.readyState !== 'loading') { init(); }
            else { document.addEventListener('DOMContentLoaded', init); }
          })();
          </script>
